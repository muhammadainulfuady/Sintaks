<body class="bg-background text-on-background min-h-screen flex flex-col">

        print(i)

<!-- Simple JS for demonstration of filling a slot -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tokens = document.querySelectorAll('.flex-wrap button');
            const slots = document.querySelectorAll('.code-slot');
            const cta = document.querySelector('button.bg-primary');
            let activeSlot = slots[0];

            slots.forEach(slot => {
                slot.addEventListener('click', () => {
                    slots.forEach(s => s.classList.remove('bg-slate-800'));
                    slot.classList.add('bg-slate-800');
                    activeSlot = slot;
                });
            });

            tokens.forEach(token => {
                token.addEventListener('click', () => {
                    if (activeSlot) {
                        activeSlot.textContent = token.textContent;
                        activeSlot.classList.add('filled');
                        activeSlot.classList.remove('bg-slate-800');
                        token.classList.add('opacity-50', 'pointer-events-none');
                        
                        // Move to next slot
                        const nextIndex = Array.from(slots).indexOf(activeSlot) + 1;
                        if (nextIndex < slots.length) {
                            activeSlot = slots[nextIndex];
                        } else {
                            activeSlot = null;
                            cta.classList.remove('cursor-not-allowed', 'opacity-50');
                            cta.disabled = false;
                        }
                    }
                });
            });
        });
    </script>
