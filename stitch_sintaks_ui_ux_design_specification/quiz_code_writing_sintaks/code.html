<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sintaks - Code Writing Quiz</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&amp;family=Manrope:wght@600;700;800&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#54647a",
                        "primary-fixed": "#e3dfff",
                        "on-surface": "#1b1b23",
                        "inverse-surface": "#302f39",
                        "surface-container-low": "#f6f2fe",
                        "inverse-primary": "#c3c0ff",
                        "on-background": "#1b1b23",
                        "on-tertiary-fixed": "#25005a",
                        "secondary-fixed": "#d3e4fe",
                        "on-primary-fixed": "#100069",
                        "error-container": "#ffdad6",
                        "tertiary": "#4b00a7",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f3effb",
                        "on-tertiary-container": "#d1b9ff",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "on-secondary-fixed": "#0b1c30",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary-container": "#6616d7",
                        "surface-tint": "#5148d7",
                        "secondary-fixed-dim": "#b7c8e1",
                        "background": "#fcf8ff",
                        "secondary-container": "#d0e1fb",
                        "tertiary-fixed": "#eaddff",
                        "surface-container-high": "#eae6f3",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e4e1ed",
                        "outline-variant": "#c7c4d7",
                        "surface-dim": "#dcd8e4",
                        "on-error": "#ffffff",
                        "surface-variant": "#e4e1ed",
                        "on-primary-fixed-variant": "#372abf",
                        "secondary": "#505f76",
                        "surface-bright": "#fcf8ff",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#464554",
                        "surface-container": "#f0ecf8",
                        "primary-fixed-dim": "#c3c0ff",
                        "tertiary-fixed-dim": "#d2bbff",
                        "surface": "#fcf8ff",
                        "primary-container": "#4338ca",
                        "outline": "#777586",
                        "on-primary-container": "#c1beff",
                        "on-tertiary": "#ffffff",
                        "primary": "#2a14b4"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sidebar-width": "240px",
                        "xs": "4px",
                        "lg": "24px",
                        "md": "16px",
                        "base": "4px",
                        "xl": "32px",
                        "max-content-width": "1200px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "code-sm": ["JetBrains Mono"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "headline-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "code-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #F8FAFC; }
        .code-bg { background-color: #0f172a; } /* Slate 900 */
        .line-number { color: #475569; } /* Slate 600 */
        .code-text { color: #f8fafc; } /* Slate 50 */
        .code-comment { color: #94a3b8; } /* Slate 400 */
        .code-keyword { color: #c7d2fe; } /* Indigo 200 */
    </style>
</head>
<body class="text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation (Task-Focused: Suppressed standard nav, showing Quiz context) -->
<header class="bg-surface-container-lowest border-b border-outline-variant h-16 flex items-center px-lg shrink-0">
<div class="max-w-max-content-width mx-auto w-full flex justify-between items-center">
<div class="flex items-center gap-md cursor-pointer hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
<span class="font-label-md text-label-md">Keluar Quiz</span>
</div>
<div class="text-center flex-1">
<span class="font-label-md text-label-md text-on-surface-variant block mb-[4px]">Soal 5 dari 10</span>
<div class="w-48 h-2 bg-surface-container-highest rounded-full mx-auto overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 50%;"></div>
</div>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-start pt-xl pb-xl px-md sm:px-lg overflow-y-auto">
<div class="max-w-[800px] w-full flex flex-col gap-lg">
<!-- Task Description -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-[0px_2px_4px_rgba(15,23,42,0.05)]">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Tantangan Koding</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Buat program menggunakan <code class="font-code-sm text-code-sm bg-surface-container-highest px-[6px] py-[2px] rounded-DEFAULT">for</code> untuk menampilkan angka ganjil dari 1 sampai 10.
                </p>
</section>
<!-- Code Editor Area -->
<section class="code-bg rounded-lg overflow-hidden border border-[#1e293b] flex flex-col min-h-[400px] shadow-lg relative group">
<!-- Editor Header -->
<div class="bg-[#1e293b] px-md py-sm flex justify-between items-center border-b border-[#334155]">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-[#cbd5e1] text-[18px]" data-icon="code">code</span>
<span class="font-code-sm text-code-sm text-[#cbd5e1]">main.py</span>
</div>
<button class="text-[#cbd5e1] hover:text-white transition-colors opacity-0 group-hover:opacity-100 flex items-center gap-[4px] font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]" data-icon="content_copy">content_copy</span>
                        Copy
                    </button>
</div>
<!-- Editor Body -->
<div class="flex-1 flex p-md relative">
<!-- Line Numbers -->
<div class="flex flex-col text-right pr-md border-r border-[#334155] select-none font-code-sm text-code-sm line-number w-[40px] shrink-0">
<span>1</span>
<span>2</span>
<span>3</span>
<span>4</span>
<span>5</span>
</div>
<!-- Editable Code Area (Simulated) -->
<div class="pl-md flex-1 font-code-sm text-code-sm outline-none whitespace-pre" contenteditable="true" spellcheck="false" style="caret-color: white;">
<span class="code-comment"># Tulis kode kamu di sini</span>
<span class="code-keyword">for</span> i <span class="code-keyword">in</span> <span class="code-keyword">range</span>(1, 11, 2):
    <span class="code-keyword">print</span>(i)</div>
</div>
</section>
<!-- Action Buttons -->
<section class="flex justify-between items-center mt-sm">
<button class="flex items-center gap-sm px-lg py-sm rounded-DEFAULT text-[#64748B] hover:bg-[#F1F5F9] hover:text-on-surface transition-colors font-label-md text-label-md bg-transparent border border-transparent">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                    Reset
                </button>
<button class="flex items-center gap-sm px-lg py-sm rounded-DEFAULT bg-primary-container text-white hover:bg-[#3730A3] transition-colors shadow-[0px_4px_6px_rgba(67,56,202,0.2)] hover:shadow-[0px_10px_15px_-3px_rgba(67,56,202,0.3)] font-label-md text-label-md">
                    Run Code
                    <span class="material-symbols-outlined" data-icon="play_arrow" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</section>
</div>
</main>
<script>
        // Micro-interaction for code editor focusing
        const editor = document.querySelector('[contenteditable="true"]');
        const editorContainer = document.querySelector('.code-bg');
        
        editor.addEventListener('focus', () => {
            editorContainer.style.boxShadow = '0 0 0 2px #4338CA, 0 10px 15px -3px rgba(15, 23, 42, 0.3)';
        });
        
        editor.addEventListener('blur', () => {
            editorContainer.style.boxShadow = '';
        });
    </script>
</body></html>
